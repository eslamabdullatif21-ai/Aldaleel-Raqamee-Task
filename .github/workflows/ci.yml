name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode test

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run PostgreSQL integration tests
        run: |
          docker_min_api="$(docker version --format '{{.Server.MinAPIVersion}}')"
          mvn --batch-mode -Dapi.version="$docker_min_api" verify -Pintegration

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PASSWORD: ci-only-database-password
      JWT_SECRET: ci-only-secret-containing-at-least-thirty-two-bytes
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker build --tag support-ticketing:ci .
