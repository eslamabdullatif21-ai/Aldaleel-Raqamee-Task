services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support_ticketing
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_local_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d support_ticketing"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/support_ticketing
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-app_local_password}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-1234567890}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-10}
      LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-PT1M}
    ports:
      - "8080:8080"
volumes:
  pgdata:
